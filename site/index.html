<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java Interview Crash Course — 4 Days</title>
<meta name="description" content="A 4-day Java + Full Stack interview crash course: core Java, OOP, collections, streams, concurrency, Spring Boot, JPA, REST, SQL, plus flashcards and quizzes.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <div class="logo">JD</div>
    <div class="brand">
      <h1>Java Interview Crash Course</h1>
      <p id="brandSub">Core Java &rarr; Full Stack &middot; 4 days</p>
    </div>
  </div>

  <div class="topbar-right">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search everything…  (press /)" autocomplete="off">
      <div id="searchResults" class="search-results" hidden></div>
    </div>
    <div class="progress-pill" title="Topics completed">
      <span id="overallPct">0%</span>
      <div class="mini-bar"><div id="overallBar" class="mini-bar-fill"></div></div>
    </div>
    <button id="themeBtn" class="icon-btn" title="Toggle theme">◐</button>
  </div>
</header>

<nav class="days" id="dayTabs"></nav>

<main class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="mode-switch" id="modeSwitch">
      <button data-mode="learn" class="active">Learn</button>
      <button data-mode="cards">Flashcards</button>
      <button data-mode="quiz">Quiz</button>
      <button data-mode="stats">Progress</button>
    </div>
    <div id="topicList" class="topic-list"></div>
  </aside>

  <section class="content" id="content"></section>

</main>

<footer class="footer">
  <span id="footerStats"></span>
  <span class="hint">
    <kbd>&larr;</kbd><kbd>&rarr;</kbd> topics &middot;
    <kbd>Space</kbd> flip card &middot;
    <kbd>1</kbd>–<kbd>4</kbd> answer &middot;
    <kbd>/</kbd> search
  </span>
</footer>

<script src="data/day1.js"></script>
<script src="data/day2.js"></script>
<script src="data/day3.js"></script>
<script src="data/day4.js"></script>
<script src="data/interview.js"></script>
<script src="app.js"></script>
</body>
</html>
